<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    
    <!-- css -->
    <link rel="stylesheet" href="/webเครือข่ายการดูแลทางสังคม/style2.css">
     <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
    
    <style>
        
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: "Sarabun", sans-serif;
    font-weight: 400;
    font-style: normal;
}

input, label, a {
    display: block;
}

.login-form {
    width: 50%;
    height: 40%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.login-form img {
    width: 100%;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -50%);

}

.login-form h1 {
    margin-top: 70px
}
    </style>
</head>
<body>

    <p id="error" style="color:red;"></p>

    <div class="login-form">
    <form onsubmit="return checkLogin()">
        <img src="ปกlogin2.jpg"><br><br><br><br><br><br><br>
        <h1>เข้าสู่ระบบ</h1><br>
            <h2><label>Username</label></h2>
            <input type="text" class="form-control" id="username" required placeholder="Enter your username"><br>
        
            <h2><label>Password</label></h2>
            <input type="password" class="form-control" id="password" required placeholder="Password"><br>
    

        <button class="btn btn-primary w-100 py-2" type="submit"><h3>Login</h3></button>
    </form>
    </div>

    <script>
        function checkLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // กำหนด username / password แบบตายตัว
            if (username === "CareNetwork" && password === "#CRNteam1") {
                // เก็บสถานะล็อกอิน
                localStorage.setItem("isLogin", "true");
                window.location.href = "homepage.html";
            } else {
                document.getElementById("error").innerText =
                    "Username หรือ Password ไม่ถูกต้อง";
            }
            return false;
        }
    </script>

</body>
</html>
